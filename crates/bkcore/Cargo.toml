[package]
name = "bkcore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core backup engine: VSS snapshot, sector I/O, chunk/hash, manifest, store, USN change tracking."

[dependencies]
blake3 = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
self-replace = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    # The installer: known folders and shortcuts, the Settings > Apps entry.
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
# Only for the Linux building blocks: SEEK_DATA/SEEK_HOLE sparse detection and
# nanosecond timestamps via utimensat. Declaring these by hand would mean
# hand-rolling `struct timespec`, which is exactly the sort of thing to get
# wrong on an architecture we cannot test on.
libc = "0.2"
