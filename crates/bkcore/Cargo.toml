[package]
name = "bkcore"
version = "0.1.0"
edition = "2021"
description = "Core backup engine: VSS snapshot, sector I/O, chunk/hash, manifest, store, USN change tracking."

[dependencies]
blake3 = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[target.'cfg(unix)'.dependencies]
# Only for the Linux building blocks: SEEK_DATA/SEEK_HOLE sparse detection and
# nanosecond timestamps via utimensat. Declaring these by hand would mean
# hand-rolling `struct timespec`, which is exactly the sort of thing to get
# wrong on an architecture we cannot test on.
libc = "0.2"
