[package]
name = "bkengine"
version = "0.1.0"
edition = "2021"
description = "Headless backup engine CLI — the binary the Windows Task Scheduler runs."

[[bin]]
name = "bkengine"
path = "src/main.rs"

[dependencies]
bkcore = { path = "../bkcore" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
# Ctrl+C must cancel cleanly (checkpoint the save state) rather than kill the
# process, so an interrupted run resumes instead of redoing work.
ctrlc = "3"
